<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full canvas cream -->
  <rect width="512" height="512" rx="108" fill="#f0dcc4"/>

  <!-- Clock ring -->
  <circle cx="256" cy="256" r="184" fill="#c67a3c"/>
  <circle cx="256" cy="256" r="164" fill="#fdf6ee"/>

  <!-- Cardinal hour markers -->
  <rect x="250" y="104" width="12" height="30" rx="4" fill="#a85d2a"/>
  <rect x="386" y="250" width="30" height="12" rx="4" fill="#a85d2a"/>
  <rect x="250" y="378" width="12" height="30" rx="4" fill="#a85d2a"/>
  <rect x="96" y="250" width="30" height="12" rx="4" fill="#a85d2a"/>

  <!-- Small hour dots -->
  <circle cx="324" cy="128" r="5" fill="#c9a07a"/>
  <circle cx="378" cy="186" r="5" fill="#c9a07a"/>
  <circle cx="378" cy="326" r="5" fill="#c9a07a"/>
  <circle cx="324" cy="384" r="5" fill="#c9a07a"/>
  <circle cx="188" cy="384" r="5" fill="#c9a07a"/>
  <circle cx="134" cy="326" r="5" fill="#c9a07a"/>
  <circle cx="134" cy="186" r="5" fill="#c9a07a"/>
  <circle cx="188" cy="128" r="5" fill="#c9a07a"/>

  <!-- Hour hand (~10 o'clock) -->
  <line x1="256" y1="256" x2="192" y2="180" stroke="#3d2512" stroke-width="14" stroke-linecap="round"/>

  <!-- Minute hand (~2 o'clock) -->
  <line x1="256" y1="256" x2="338" y2="172" stroke="#5a3518" stroke-width="8" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#c67a3c"/>
  <circle cx="256" cy="256" r="5" fill="#fdf6ee"/>
</svg>
